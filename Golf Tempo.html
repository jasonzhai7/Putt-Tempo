<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Putt Tempo">
<title>Putt Tempo</title>
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #000; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-bleed black stage holds one white line that sweeps past a ball ring.
   Controls live in a dock below it and open as sheets above the dock, so the stage never resizes. */
:root {
  --ink: #000000;          /* stage, true black for OLED */
  --panel: #0d110e;        /* sheets and dock buttons */
  --panel-2: #161c18;      /* inputs and chips */
  --rule: #252d27;         /* hairlines */
  --track: #3a443d;        /* slider track */
  --text: #f2f5f0;
  --muted: #8f9b92;
  --line: #ffffff;         /* the cue line */
  --ghost: rgba(255, 255, 255, 0.18);
  --danger: #e48b7e;
  --font-ui: 'Familjen Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.4 var(--font-ui);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
h3 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

/* ---------- stage ---------- */
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.cue {
  position: absolute; top: 14px; left: 0; right: 0; text-align: center;
  color: var(--muted); font-size: 13px; padding-inline: 8px;
  transition: opacity 0.4s ease;
}
body.running .cue { opacity: 0; }
.ball {
  position: absolute; left: 50%; top: 50%;
  width: var(--ball, 120px); height: var(--ball, 120px);
  margin: calc(var(--ball, 120px) / -2) 0 0 calc(var(--ball, 120px) / -2);
  border: 2px solid rgba(255, 255, 255, 0.55);
  border-radius: 50%;
  transition: background-color 0.35s ease, border-color 0.35s ease;
}
.ball::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.55);
}
.ball.hit { background: rgba(255, 255, 255, 0.24); border-color: #fff; transition-duration: 0.03s; }
.tick { position: absolute; left: 50%; top: 50%; width: 44px; height: 2px; margin-left: -22px; background: var(--ghost); }
.tick span {
  position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
  font: 400 10px/1 var(--font-num); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
}
.sweep {
  position: absolute; left: 50%; top: 50%;
  width: min(86%, 720px); height: 4px; border-radius: 2px; background: var(--line);
  transform: translate(-50%, -2px); will-change: transform;
}

/* ---------- dock ---------- */
.dock {
  display: grid; gap: 12px; padding-block: 12px;
  grid-template-columns: 1fr 1fr;
  grid-template-areas: "run run" "tempo log";
}
#btnRun { grid-area: run; }
#btnTempo { grid-area: tempo; }
#btnLog { grid-area: log; }
@media (min-width: 560px) {
  .dock { grid-template-columns: 1fr auto 1fr; grid-template-areas: "tempo run log"; }
}
.dock-side {
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
  min-width: 0; min-height: 52px; padding: 8px 14px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); text-align: left;
}
.dock-side[aria-expanded="true"] { border-color: #fff; }
.dock-side .k { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.dock-side .v { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; }
.run {
  min-width: 132px; height: 56px; padding: 0 28px; border-radius: 28px;
  background: #fff; color: #000; font-size: 17px; font-weight: 600; letter-spacing: 0.01em;
}
body.running .run { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px #fff; }

/* ---------- sheets ---------- */
.scrim { position: fixed; left: 0; right: 0; top: 0; bottom: var(--dock-h, 96px); background: rgba(0, 0, 0, 0.55); z-index: 15; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: var(--dock-h, 96px);
  max-height: calc(100vh - var(--dock-h, 96px) - 88px);
  max-height: calc(100dvh - var(--dock-h, 96px) - 88px);
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--panel); border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) 18px max(16px, env(safe-area-inset-left, 0px));
  z-index: 20; box-shadow: 0 -14px 34px rgba(0, 0, 0, 0.65);
  animation: rise 0.18s ease-out;
  -webkit-user-select: auto; user-select: auto;
}
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 6px; }
.done { min-height: 40px; padding: 0 4px; color: var(--muted); font-weight: 500; }
.group { display: grid; gap: 4px; padding-top: 14px; }
.field { display: grid; gap: 8px; padding-block: 10px; border-top: 1px solid var(--rule); }
.group > h3 + .field { margin-top: 8px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.row label, .row .lbl { font-size: 14px; }
.val { font: 500 13px var(--font-num); font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
.hint.mono { font-family: var(--font-num); font-size: 12px; font-variant-numeric: tabular-nums; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; margin: 0; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--track); border-radius: 1px; }
input[type=range]::-moz-range-track { height: 2px; background: var(--track); border-radius: 1px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -11px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 0 0 5px rgba(255, 255, 255, 0.12); }
input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; border: 0; background: #fff; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-width: 56px; min-height: 42px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--panel-2); font: 500 14px var(--font-num); font-variant-numeric: tabular-nums;
}
.chip[aria-checked="true"] { background: #fff; color: #000; border-color: #fff; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { min-height: 42px; padding: 0 12px; font-size: 14px; background: var(--panel-2); }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-checked="true"] { background: #fff; color: #000; font-weight: 600; }
.switch { position: relative; width: 52px; height: 30px; border-radius: 15px; background: var(--track); transition: background-color 0.15s; flex: none; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch[aria-checked="true"] { background: #fff; }
.switch[aria-checked="true"]::after { background: #000; transform: translateX(22px); }

/* ---------- log ---------- */
.dist { display: grid; grid-template-columns: 52px 1fr 52px; gap: 8px; }
.step { min-height: 56px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); font: 500 22px var(--font-num); }
#dist {
  width: 100%; min-width: 0; min-height: 56px; text-align: center; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--panel-2); color: var(--text); font: 500 28px var(--font-num); font-variant-numeric: tabular-nums;
  -webkit-user-select: text; user-select: text;
}
.primary { width: 100%; min-height: 52px; border-radius: 8px; background: #fff; color: #000; font-weight: 600; font-size: 16px; }
.primary:disabled { background: var(--track); color: var(--muted); cursor: default; }
.err { margin: 0; min-height: 18px; font-size: 13px; color: var(--danger); }
.entries { display: grid; }
.entry { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; padding-block: 6px; border-top: 1px solid var(--rule); min-height: 48px; }
.entry .t { font: 400 12px var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; }
.entry .d { font: 500 16px var(--font-num); font-variant-numeric: tabular-nums; }
.entry .tags { font: 400 12px var(--font-num); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry .del { min-height: 40px; padding: 0 6px; font-size: 12px; color: var(--muted); }
.entry .del.armed { color: var(--danger); }
.empty { margin: 0; padding-block: 14px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.ghost { min-height: 42px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); font-size: 14px; }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 8px; background: #fff; color: #000;
  font: 500 13px/1.3 var(--font-num); z-index: 40; text-align: center;
}
</style>
</head>
<body>


<main class="stage" id="stage" aria-label="Tempo cue">
  <p class="cue" id="cue">Put the ball on the ring, press Start, and stroke with the line.</p>
  <div class="tick" id="tickBack"><span>Back</span></div>
  <div class="tick" id="tickThru"><span>Through</span></div>
  <div class="ball" id="ball"></div>
  <div class="sweep" id="sweep"></div>
</main>

<nav class="dock" id="dock" aria-label="Controls">
  <button class="dock-side" id="btnTempo" aria-expanded="false" aria-controls="sheetTempo">
    <span class="k">Tempo</span><span class="v" id="tempoSummary">1.05 s · 2:1</span>
  </button>
  <button class="run" id="btnRun">Start</button>
  <button class="dock-side" id="btnLog" aria-expanded="false" aria-controls="sheetLog">
    <span class="k">Log putt</span><span class="v" id="logSummary">0 today</span>
  </button>
</nav>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheetTempo" role="dialog" aria-labelledby="hTempo" hidden>
  <div class="sheet-head"><h2 id="hTempo">Tempo and display</h2><button class="done" data-close>Done</button></div>

  <div class="group">
    <h3>Tempo</h3>
    <div class="field">
      <div class="row"><label for="T">Back to impact</label><span class="val" id="Tval">1.05 s</span></div>
      <input type="range" id="T" min="0.6" max="2" step="0.05" value="1.05">
      <p class="hint mono" id="derived"></p>
    </div>
    <div class="field">
      <div class="row"><span class="lbl" id="lblRatio">Backswing to downswing</span></div>
      <div class="chips" id="ratio" role="radiogroup" aria-labelledby="lblRatio">
        <button class="chip" role="radio" data-r="1">1:1</button>
        <button class="chip" role="radio" data-r="1.5">1.5:1</button>
        <button class="chip" role="radio" data-r="2">2:1</button>
        <button class="chip" role="radio" data-r="2.5">2.5:1</button>
        <button class="chip" role="radio" data-r="3">3:1</button>
      </div>
    </div>
  </div>

  <div class="group">
    <h3>Stroke</h3>
    <div class="field">
      <div class="row"><span class="lbl" id="lblMode">Cue style</span></div>
      <div class="seg" id="modeSeg" role="radiogroup" aria-labelledby="lblMode">
        <button role="radio" data-mode="single">Single stroke</button>
        <button role="radio" data-mode="pendulum">Pendulum</button>
      </div>
      <p class="hint" id="modeHint"></p>
    </div>
    <div class="field">
      <div class="row"><label for="travel">Stroke length</label><span class="val" id="travelVal">78%</span></div>
      <input type="range" id="travel" min="30" max="95" step="1" value="78">
    </div>
    <div class="field" id="restGroup">
      <div class="row"><label for="rest">Rest between strokes</label><span class="val" id="restVal">2.0 s</span></div>
      <input type="range" id="rest" min="0" max="8" step="0.5" value="2">
    </div>
    <div class="field">
      <div class="row"><span class="lbl" id="lblDir">Backswing goes</span></div>
      <div class="seg" id="dirSeg" role="radiogroup" aria-labelledby="lblDir">
        <button role="radio" data-dir="1">Up the screen</button>
        <button role="radio" data-dir="-1">Down the screen</button>
      </div>
    </div>
  </div>

  <div class="group">
    <h3>Display</h3>
    <div class="field">
      <div class="row"><label for="ball">Ball ring size</label><span class="val" id="ballVal">120 px</span></div>
      <input type="range" id="ball" min="40" max="260" step="2" value="120">
    </div>
    <div class="field">
      <div class="row"><span class="lbl" id="lblSound">Tick at impact</span><button class="switch" id="sound" role="switch" aria-checked="false" aria-labelledby="lblSound"></button></div>
    </div>
  </div>
</section>

<section class="sheet" id="sheetLog" role="dialog" aria-labelledby="hLog" hidden>
  <div class="sheet-head"><h2 id="hLog">Log a putt</h2><button class="done" data-close>Done</button></div>

  <div class="group">
    <div class="field" style="border-top:0">
      <div class="row">
        <label for="dist">Putt distance</label>
        <div class="seg" id="unitSeg" role="radiogroup" aria-label="Distance unit" style="width:128px">
          <button role="radio" data-unit="ft">ft</button>
          <button role="radio" data-unit="m">m</button>
        </div>
      </div>
      <div class="dist">
        <button class="step" id="distDown" aria-label="Decrease distance">−</button>
        <input id="dist" type="number" inputmode="decimal" min="0" step="0.5" value="10">
        <button class="step" id="distUp" aria-label="Increase distance">+</button>
      </div>
      <div class="chips" id="distChips"></div>
      <p class="err" id="distErr" role="alert"></p>
      <button class="primary" id="saveBtn" disabled>Save putt</button>
      <p class="hint mono" id="storeStatus">Connecting…</p>
    </div>

    <h3 id="hRecent">Recent</h3>
    <p class="hint mono" id="logStats"></p>
    <div class="entries" id="entries" aria-labelledby="hRecent"></div>
    <div class="tools">
      <button class="ghost" id="exportBtn">Export CSV</button>
      <button class="ghost" id="copyBtn">Copy CSV</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LS_SET = 'putt-tempo-settings', LS_LOG = 'putt-tempo-log';
  var RATIOS = [1, 1.5, 2, 2.5, 3];
  var LEAD = 1.2; // seconds the line waits at the ball before the first backswing
  var DEF = { T: 1.05, r: 2, mode: 'single', travel: 78, rest: 2, ball: 120, dir: 1, sound: false, unit: 'ft' };

  function clamp(v, a, b) { v = +v; return isFinite(v) ? Math.min(b, Math.max(a, v)) : a; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- settings (per-device convenience) ---------- */
  function sanitize(j) {
    var o = {};
    if (j.T != null) o.T = clamp(j.T, 0.6, 2);
    if (RATIOS.indexOf(+j.r) > -1) o.r = +j.r;
    if (j.mode === 'single' || j.mode === 'pendulum') o.mode = j.mode;
    if (j.travel != null) o.travel = clamp(j.travel, 30, 95);
    if (j.rest != null) o.rest = clamp(j.rest, 0, 8);
    if (j.ball != null) o.ball = clamp(j.ball, 40, 260);
    if (j.dir === 1 || j.dir === -1) o.dir = j.dir;
    o.sound = !!j.sound;
    if (j.unit === 'ft' || j.unit === 'm') o.unit = j.unit;
    return o;
  }
  function loadSettings() {
    try { var j = JSON.parse(localStorage.getItem(LS_SET) || 'null'); return j && typeof j === 'object' ? sanitize(j) : {}; }
    catch (e) { return {}; }
  }
  function saveSettings() { try { localStorage.setItem(LS_SET, JSON.stringify(S)); } catch (e) {} }
  var S = Object.assign({}, DEF, loadSettings());

  /* ---------- tempo maths ---------- */
  function ratioLabel(r) { return (r % 1 === 0 ? String(r) : r.toFixed(1)) + ':1'; }
  function parts() { var u = S.T / (S.r + 1); return { u: u, back: S.r * u }; } // u = top of backswing to impact
  // p runs from -1 (back end) to +1 (through end); 0 is the ball. The line crosses 0 at its fastest at impact.
  function plan() {
    var p = parts(), u = p.u, back = p.back;
    if (S.mode === 'pendulum') {
      var up = 2 * back, down = 2 * u;
      return {
        cyc: up + down, impact: up + u, startE: up / 2,
        pos: function (t) { return t < up ? Math.cos(Math.PI * t / up) : -Math.cos(Math.PI * (t - up) / down); }
      };
    }
    var dB = back, dT = 2 * u, dR = Math.max(0.8, back), dW = S.rest;
    return {
      cyc: dB + dT + dR + dW, impact: dB + u, startE: -LEAD,
      pos: function (t) {
        if (t < dB) return -(1 - Math.cos(Math.PI * t / dB)) / 2;
        t -= dB; if (t < dT) return -Math.cos(Math.PI * t / dT);
        t -= dT; if (t < dR) return (1 + Math.cos(Math.PI * t / dR)) / 2;
        return 0;
      }
    };
  }

  /* ---------- stage ---------- */
  var stage = $('stage'), sweep = $('sweep'), ball = $('ball'), dock = $('dock');
  var amp = 100, running = false, t0 = 0, lastK = -1, raf = 0, P = plan();

  function setY(y) { sweep.style.transform = 'translate(-50%,' + (y - 2) + 'px)'; }
  function layout() {
    amp = Math.max(40, stage.clientHeight / 2 - 30) * S.travel / 100;
    $('tickBack').style.transform = 'translateY(' + (-S.dir * amp - 1) + 'px)';
    $('tickThru').style.transform = 'translateY(' + (S.dir * amp - 1) + 'px)';
    if (!running) setY(0);
  }
  function measureDock() {
    var r = dock.getBoundingClientRect();
    document.documentElement.style.setProperty('--dock-h', Math.max(0, Math.round(window.innerHeight - r.top)) + 'px');
  }

  var ac = null;
  function ensureAudio() {
    try {
      if (!ac) { var C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function beep() {
    if (!ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
      o.type = 'sine'; o.frequency.value = 1100;
      g.gain.setValueAtTime(0.0001, n);
      g.gain.exponentialRampToValueAtTime(0.35, n + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, n + 0.07);
      o.connect(g); g.connect(ac.destination); o.start(n); o.stop(n + 0.09);
    } catch (e) {}
  }
  var hitTimer = 0;
  function hit() {
    ball.classList.add('hit');
    clearTimeout(hitTimer);
    hitTimer = setTimeout(function () { ball.classList.remove('hit'); }, 140);
    if (S.sound) beep();
  }

  var wl = null;
  function lockScreen() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (l) {
          wl = l; l.addEventListener('release', function () { wl = null; });
        }, function () {});
      }
    } catch (e) {}
  }
  function unlockScreen() { try { if (wl) wl.release(); } catch (e) {} wl = null; }
  document.addEventListener('visibilitychange', function () {
    if (running && document.visibilityState === 'visible' && !wl) lockScreen();
  });

  function frame(now) {
    if (!running) return;
    var e = (now - t0) / 1000;
    var k = Math.floor((e - P.impact) / P.cyc);
    if (k > lastK) { lastK = k; hit(); }
    var t = e < 0 ? 0 : e % P.cyc;
    setY(S.dir * P.pos(t) * amp);
    raf = requestAnimationFrame(frame);
  }
  function begin() {
    P = plan();
    t0 = performance.now() - P.startE * 1000;
    lastK = -1;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(frame);
  }
  function start() {
    running = true;
    document.body.classList.add('running');
    $('btnRun').textContent = 'Stop';
    if (S.sound) ensureAudio();
    lockScreen();
    begin();
  }
  function stop() {
    running = false;
    cancelAnimationFrame(raf);
    document.body.classList.remove('running');
    $('btnRun').textContent = 'Start';
    ball.classList.remove('hit');
    setY(0);
    unlockScreen();
  }
  $('btnRun').addEventListener('click', function () { running ? stop() : start(); });

  /* ---------- settings UI ---------- */
  function mark(id, test) {
    Array.prototype.forEach.call($(id).querySelectorAll('button'), function (b) {
      b.setAttribute('aria-checked', test(b) ? 'true' : 'false');
    });
  }
  function syncUI() {
    var p = parts();
    $('T').value = S.T; $('Tval').textContent = S.T.toFixed(2) + ' s';
    $('derived').textContent = 'Backswing ' + p.back.toFixed(2) + ' s, then ' + p.u.toFixed(2) + ' s from the top to the ball';
    $('tempoSummary').textContent = S.T.toFixed(2) + ' s · ' + ratioLabel(S.r);
    mark('ratio', function (b) { return +b.dataset.r === S.r; });
    mark('modeSeg', function (b) { return b.dataset.mode === S.mode; });
    mark('dirSeg', function (b) { return +b.dataset.dir === S.dir; });
    mark('unitSeg', function (b) { return b.dataset.unit === S.unit; });
    $('modeHint').textContent = S.mode === 'single'
      ? 'The line waits at the ball, goes back, passes the ball at impact, then returns and rests.'
      : 'The line swings back and forth without stopping. It crosses the ball once on each pass.';
    $('travel').value = S.travel; $('travelVal').textContent = Math.round(S.travel) + '%';
    $('rest').value = S.rest; $('restVal').textContent = S.rest === 0 ? 'None' : S.rest.toFixed(1) + ' s';
    $('restGroup').hidden = S.mode !== 'single';
    $('ball').value = S.ball; $('ballVal').textContent = Math.round(S.ball) + ' px';
    stage.style.setProperty('--ball', S.ball + 'px');
    $('sound').setAttribute('aria-checked', S.sound ? 'true' : 'false');
  }
  function changed(restart) {
    saveSettings(); syncUI(); layout();
    if (running && restart) begin();
  }
  function slider(id, key, lo, hi) {
    $(id).addEventListener('input', function () { S[key] = clamp(this.value, lo, hi); changed(false); });
    $(id).addEventListener('change', function () { if (running) begin(); });
  }
  slider('T', 'T', 0.6, 2); slider('travel', 'travel', 30, 95); slider('rest', 'rest', 0, 8); slider('ball', 'ball', 40, 260);
  function group(id, fn) {
    $(id).addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) fn(b); });
  }
  group('ratio', function (b) { S.r = +b.dataset.r; changed(true); });
  group('modeSeg', function (b) { S.mode = b.dataset.mode; changed(true); });
  group('dirSeg', function (b) { S.dir = +b.dataset.dir; changed(false); });
  $('sound').addEventListener('click', function () {
    S.sound = !S.sound; if (S.sound) ensureAudio(); changed(false);
  });

  /* ---------- sheets ---------- */
  var openName = null;
  function closeSheet() {
    $('sheetTempo').hidden = true; $('sheetLog').hidden = true; $('scrim').hidden = true;
    $('btnTempo').setAttribute('aria-expanded', 'false'); $('btnLog').setAttribute('aria-expanded', 'false');
    openName = null;
  }
  function openSheet(name) {
    if (openName === name) { closeSheet(); return; }
    closeSheet(); measureDock();
    openName = name;
    $('sheet' + name).hidden = false;
    if (name === 'Log') { $('scrim').hidden = false; renderLog(); }
    $('btn' + name).setAttribute('aria-expanded', 'true');
  }
  $('btnTempo').addEventListener('click', function () { openSheet('Tempo'); });
  $('btnLog').addEventListener('click', function () { openSheet('Log'); });
  $('scrim').addEventListener('click', closeSheet);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) { b.addEventListener('click', closeSheet); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  var toastTimer = 0;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600);
  }

  /* ---------- log storage ---------- */
  var store = { days: {}, mode: 'local', col: null, ready: false, pending: 0, queue: Promise.resolve(), dl: null, unsub: null };
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function loadLocal() {
    try { var j = JSON.parse(localStorage.getItem(LS_LOG) || 'null'); store.days = j && typeof j === 'object' ? j : {}; }
    catch (e) { store.days = {}; }
  }
  function saveLocal() { try { localStorage.setItem(LS_LOG, JSON.stringify(store.days)); } catch (e) {} }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function persistDay(day) {
    store.pending++;
    store.queue = store.queue.then(function () {
      if (store.mode !== 'db') { saveLocal(); return; }
      var ref = store.col.doc(day);
      var write = function () {
        var entries = store.days[day] || [];
        return entries.length ? ref.set({ entries: entries }) : ref.delete();
      };
      return write().catch(function (e) {
        if (e && e.code === 'unavailable') return sleep(400 + Math.random() * 600).then(write);
        throw e;
      });
    }).catch(function () {
      toast('Could not sync that change. It is kept on this screen only.');
    }).then(function () { store.pending--; });
  }

  function allEntries() {
    var a = [];
    Object.keys(store.days).forEach(function (k) { (store.days[k] || []).forEach(function (e) { a.push(e); }); });
    a.sort(function (x, y) { return y.ts - x.ts; });
    return a;
  }
  function conv(e, unit) { return e.u === unit ? e.d : (unit === 'm' ? e.d / 3.28084 : e.d * 3.28084); }
  function fmtD(x) { return String(Math.round(x * 10) / 10); }
  function fmtTime(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  function addEntry(e) {
    var day = dayKey(e.ts);
    store.days[day] = (store.days[day] || []).concat(e);
    persistDay(day); renderLog();
  }
  function removeEntry(id) {
    Object.keys(store.days).forEach(function (day) {
      var list = store.days[day] || [];
      var next = list.filter(function (e) { return e.id !== id; });
      if (next.length !== list.length) {
        if (next.length) store.days[day] = next; else delete store.days[day];
        persistDay(day);
      }
    });
    renderLog();
  }

  function renderLog() {
    var today = store.days[dayKey(Date.now())] || [];
    $('logSummary').textContent = store.ready ? today.length + ' today' : '…';
    $('saveBtn').disabled = !store.ready;
    $('storeStatus').textContent = !store.ready ? 'Connecting…'
      : store.mode === 'db' ? 'Saved privately to your account, so it follows you across devices.'
      : 'Saved on this device only.';
    if (today.length) {
      var sum = 0; today.forEach(function (e) { sum += conv(e, S.unit); });
      $('logStats').textContent = 'Today: ' + today.length + (today.length === 1 ? ' putt' : ' putts') + ', average ' + fmtD(sum / today.length) + ' ' + S.unit;
    } else { $('logStats').textContent = ''; }

    var box = $('entries'); box.textContent = '';
    if (!store.ready) { return; }
    var list = allEntries().slice(0, 12);
    if (!list.length) {
      var p = document.createElement('p'); p.className = 'empty';
      p.textContent = 'Putts you save appear here with the tempo you used. Enter a distance above and press Save putt.';
      box.appendChild(p); return;
    }
    list.forEach(function (e) {
      var row = document.createElement('div'); row.className = 'entry';
      var t = document.createElement('span'); t.className = 't'; t.textContent = (dayKey(e.ts) === dayKey(Date.now()) ? '' : dayKey(e.ts).slice(5) + ' ') + fmtTime(e.ts);
      var d = document.createElement('span'); d.className = 'd'; d.textContent = fmtD(e.d) + ' ' + e.u;
      var tg = document.createElement('span'); tg.className = 'tags'; tg.textContent = (+e.t).toFixed(2) + ' s · ' + ratioLabel(+e.r);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete'; del.setAttribute('aria-label', 'Delete this putt');
      del.addEventListener('click', function () {
        if (del.classList.contains('armed')) { removeEntry(e.id); return; }
        del.classList.add('armed'); del.textContent = 'Sure?';
        setTimeout(function () { if (del.isConnected) { del.classList.remove('armed'); del.textContent = 'Delete'; } }, 3000);
      });
      row.appendChild(t); row.appendChild(d); row.appendChild(tg); row.appendChild(del);
      box.appendChild(row);
    });
  }

  /* ---------- log inputs ---------- */
  var CHIPS = { ft: [3, 6, 10, 15, 20, 30, 40, 50], m: [1, 2, 3, 5, 8, 10, 15, 20] };
  function stepSize() { return S.unit === 'ft' ? 1 : 0.5; }
  function renderChips() {
    var c = $('distChips'); c.textContent = '';
    CHIPS[S.unit].forEach(function (v) {
      var b = document.createElement('button'); b.className = 'chip'; b.textContent = String(v);
      b.addEventListener('click', function () { $('dist').value = v; $('distErr').textContent = ''; });
      c.appendChild(b);
    });
  }
  function setDist(v) { $('dist').value = String(Math.round(v * 10) / 10); $('distErr').textContent = ''; }
  $('distDown').addEventListener('click', function () { setDist(Math.max(0, (parseFloat($('dist').value) || 0) - stepSize())); });
  $('distUp').addEventListener('click', function () { setDist((parseFloat($('dist').value) || 0) + stepSize()); });
  group('unitSeg', function (b) {
    var next = b.dataset.unit; if (next === S.unit) return;
    var v = parseFloat($('dist').value);
    S.unit = next;
    if (isFinite(v) && v > 0) {
      var f = next === 'm' ? v / 3.28084 : v * 3.28084, st = next === 'ft' ? 1 : 0.5;
      setDist(Math.max(st, Math.round(f / st) * st));
    }
    $('dist').step = String(stepSize());
    saveSettings(); syncUI(); renderChips(); renderLog();
  });
  $('saveBtn').addEventListener('click', function () {
    var v = parseFloat($('dist').value);
    if (!isFinite(v) || v <= 0 || v > 300) { $('distErr').textContent = 'Enter a distance above 0 and up to 300.'; return; }
    $('distErr').textContent = '';
    addEntry({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Date.now(), d: Math.round(v * 10) / 10, u: S.unit, t: S.T, r: S.r, m: S.mode });
    toast('Logged ' + fmtD(v) + ' ' + S.unit + ' · ' + S.T.toFixed(2) + ' s, ' + ratioLabel(S.r));
    closeSheet();
  });

  function csv() {
    var rows = ['date,time,distance,unit,tempo_s,ratio,mode'];
    allEntries().reverse().forEach(function (e) {
      rows.push([dayKey(e.ts), fmtTime(e.ts), fmtD(e.d), e.u, (+e.t).toFixed(2), e.r, e.m].join(','));
    });
    return rows.join('\n');
  }
  function blobDownload() {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv()], { type: 'text/csv' }));
    a.download = 'putt-tempo-log.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }
  $('exportBtn').addEventListener('click', function () {
    if (!allEntries().length) { toast('Nothing to export yet.'); return; }
    if (!store.dl) { blobDownload(); return; }
    store.dl.save({ filename: 'putt-tempo-log.csv', data: csv() }).then(function () { toast('CSV saved'); }, function (err) {
      if (err && err.code === 'declined') return;
      toast('Export is not available here. Try Copy CSV.');
    });
  });
  $('copyBtn').addEventListener('click', function () {
    if (!allEntries().length) { toast('Nothing to copy yet.'); return; }
    try {
      navigator.clipboard.writeText(csv()).then(function () { toast('CSV copied'); }, function () { toast('Copy is blocked in this view.'); });
    } catch (e) { toast('Copy is blocked in this view.'); }
  });

  function initStore() {
    var fallback = function () { store.mode = 'local'; loadLocal(); store.ready = true; renderLog(); };
    if (!window.claude || !window.claude.use) { fallback(); return; }
    var guard = setTimeout(function () {
      if (!store.ready) { if (store.unsub) store.unsub(); fallback(); toast('Could not reach your account. Logging on this device.'); }
    }, 8000);
    Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]).then(function (r) {
      var db = r[0], user = r[1];
      store.dl = r[2];
      return (user ? user.id() : Promise.resolve(null)).then(function (uid) {
        if (!db || !uid) { clearTimeout(guard); fallback(); return; }
        store.mode = 'db'; store.col = db.collection('data/users/' + uid);
        store.unsub = store.col.limit(1000).onSnapshot(function (snap) {
          if (store.pending > 0) return;
          var d = {};
          snap.docs.forEach(function (ds) { var b = ds.data(); if (b && Array.isArray(b.entries) && b.entries.length) d[ds.id] = b.entries; });
          store.days = d; store.ready = true; clearTimeout(guard); renderLog();
        }, function () {
          clearTimeout(guard); fallback(); toast('Sync is unavailable. Logging on this device.');
        });
      });
    }).catch(function () { clearTimeout(guard); fallback(); });
  }

  /* ---------- boot ---------- */
  syncUI(); renderChips(); $('dist').step = String(stepSize());
  measureDock(); layout(); renderLog();
  if (window.ResizeObserver) { new ResizeObserver(function () { measureDock(); layout(); }).observe(stage); new ResizeObserver(measureDock).observe(dock); }
  window.addEventListener('resize', function () { measureDock(); layout(); });
  initStore();
})();
</script>
</body>
</html>
